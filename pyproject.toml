[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "evidenceflow-ai"
version = "0.11.0"
description = "Evidence-grounded document intelligence and RAG evaluation pipeline"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Niranjan Ghising" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "google-genai>=1.0,<2.0",
  "groq>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pypdf>=5,<7",
  "python-dotenv>=1.0,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<10.0",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1.0",
]

rag = [
  "numpy>=1.26,<3.0",
  "rank-bm25>=0.2.2,<1.0",
  "sentence-transformers>=3.3,<6.0",
]

ui = [
  "streamlit>=1.40,<2.0",
]

[project.scripts]
evidenceflow = "evidenceflow.__main__:main"
evidenceflow-ingest = "evidenceflow.ingestion.cli:main"
evidenceflow-chunk = "evidenceflow.chunking.cli:main"
evidenceflow-index = "evidenceflow.indexing.cli:index_main"
evidenceflow-search = "evidenceflow.indexing.cli:search_main"
evidenceflow-hybrid-search = "evidenceflow.retrieval.cli:main"
evidenceflow-reranked-search = "evidenceflow.reranking.cli:main"
evidenceflow-answer = "evidenceflow.generation.cli:main"
evidenceflow-evaluate = "evidenceflow.evaluation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evidenceflow"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]